{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="icon" href="{% static 'images/pomodoro-logo.svg' %}" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <div class="profile-container">
        <h2>Your Profile</h2>

        {% for message in messages %}
            <p class="message {{ message.tags }}">{{ message }}</p>
        {% endfor %}
        {% for field in form %}
            {% for error in field.errors %}
                <p class="message error">{{ error }}</p>
            {% endfor %}
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       value="{{ form.username.value|default_if_none:'' }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       value="{{ form.email.value|default_if_none:'' }}" required>
            </div>

            <button type="submit">Save Changes</button>
        </form>

        <a href="{% url 'home' %}" class="back-link">← Back to Timer</a>
    </div>
</body>
</html>

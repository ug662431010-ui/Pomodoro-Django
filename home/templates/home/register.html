{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="icon" href="{% static 'images/pomodoro-logo.svg' %}" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="register-page">
    <div class="login-container">
        <img class="brand-logo" src="{% static 'images/pomodoro-logo.svg' %}" alt="Pomodoro logo">

        {% for error in form.non_field_errors %}
            <p class="message error">{{ error }}</p>
        {% endfor %}
        {% for field in form %}
            {% for error in field.errors %}
                <p class="message error">{{ error }}</p>
            {% endfor %}
        {% endfor %}

        <h2>Create Account</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Your name"
                       value="{{ form.username.value|default_if_none:'' }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@email.com"
                       value="{{ form.email.value|default_if_none:'' }}" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('password')">👁️</span>
                </div>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="">-- Select Status --</option>
                    <option value="student" {% if form.status.value == 'student' %}selected{% endif %}>Student</option>
                    <option value="lecturer" {% if form.status.value == 'lecturer' %}selected{% endif %}>Lecturer</option>
                    <option value="other" {% if form.status.value == 'other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <button type="submit">Register</button>

            <p class="bottom-text">
                Already have an account? <a href="{% url 'login' %}">Login Here</a>
            </p>
        </form>
    </div>

    <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
